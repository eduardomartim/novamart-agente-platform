# Dashboard hardening. These are security controls, not cosmetics.
#
# Streamlit renders unhandled exceptions itself, so that output never passes
# through the platform's secure_output() redaction. The only place to close
# that gap is here.

[client]
# F9: with the default "full", a raised exception renders its traceback --
# including absolute source paths -- into the browser, disclosing the
# operating user's name and the machine's directory layout. Streamlit 1.62
# also attaches "Ask Google" / "Ask ChatGPT" buttons to that output, which
# would forward the path to a third party. "type" keeps the exception class,
# which is enough to say something broke, and drops the paths.
showErrorDetails = "type"

# Hide developer controls (deploy, rerun, clear cache) from viewers. A reader
# of the demo has no use for them and should not be able to click "Deploy".
toolbarMode = "viewer"

[browser]
# A demonstration of controlled execution should not phone home.
gatherUsageStats = false

[server]
# The dashboard reads a local SQLite database and needs no uploads.
maxUploadSize = 1

# Visual identity. Colours only -- no behaviour, and nothing above this line
# changes: the hardening settings are security controls and stay exactly as
# they were.
#
# Dark, near-black graphite with a single blue accent. Green, red and amber are
# reserved for meaning (ALLOW / DENY / warning) and are never used decoratively,
# so a colour in this interface always says something.
[theme]
base = "dark"
primaryColor = "#2F81F7"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#141A23"
textColor = "#E6EDF3"
font = "sans serif"
