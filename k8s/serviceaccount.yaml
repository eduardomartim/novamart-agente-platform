# A dedicated identity with no permissions and no token.
#
# `automountServiceAccountToken: false` because the application never talks to
# the Kubernetes API. Mounting a token it does not use would put a credential
# inside every pod for nothing -- and a credential that exists is a credential
# that can be read out of a compromised process.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
automountServiceAccountToken: false
