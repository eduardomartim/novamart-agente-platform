# TEMPLATE. Contains no secret and must never be filled in and committed.
#
# Generate a real one out-of-band and apply it without writing it to disk:
#
#   kubectl -n agent-platform create secret generic agent-platform-secrets \
#     --from-literal=EXECUTION_GRANT_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# GEMINI_API_KEY is not here on purpose. This deployment runs the deterministic
# stub, and a key in a cluster Secret is a key in etcd -- base64 is encoding,
# not encryption. Nothing in this phase needs one.
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
type: Opaque
stringData:
  EXECUTION_GRANT_SECRET: "REPLACE_ME_WITH_A_GENERATED_VALUE"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_GENERATED_VALUE"
