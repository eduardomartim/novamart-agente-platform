# TEMPLATE. Contains no key and must never be filled in and committed.
#
# The real Secret is created by scripts/gen_tls_secret.sh, which generates a
# self-signed certificate with openssl and pipes both halves straight to
# kubectl. The private key is never written to the working tree, never passed
# in an argv, and never appears in this repository -- .gitignore refuses *.key,
# *.pem and *.crt by extension so that a key dropped anywhere is still ignored.
#
# Self-signed, on purpose. A local cluster reached at a made-up hostname has no
# business holding a certificate from a real CA, and obtaining one would mean
# proving control of a domain that does not exist. The trade is that a client
# must be told to trust it once; see docs/kubernetes.md.
#
# This is transport security. It is not authentication: a request arriving over
# HTTPS without a bearer credential still gets 401.
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-tls
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
type: kubernetes.io/tls
stringData:
  tls.crt: |
    REPLACE_ME_RUN_scripts/gen_tls_secret.sh_INSTEAD
  tls.key: |
    REPLACE_ME_NEVER_PUT_A_PRIVATE_KEY_HERE
