# TEMPLATE. Contains no credential and must never be filled in and committed.
#
# The API refuses to start without this Secret. That is the intended behaviour,
# not an obstacle to work around: a deployment that comes up unauthenticated
# because its credentials were missing is the failure this design exists to
# prevent.
#
# Mint credentials out-of-band -- the token is printed once, and only the digest
# ever reaches a cluster:
#
#   agent-platform auth new-key --principal ops-oncall --scope confirm:write
#   agent-platform auth new-key --principal ingest-svc --scope runs:write
#   agent-platform auth new-key --principal prometheus --scope metrics:read
#
# Then apply the table without writing it to disk:
#
#   kubectl -n agent-platform create secret generic agent-platform-auth \
#     --from-file=keys=/dev/stdin <<'KEYS'
#   <paste the configuration lines here>
#   KEYS
#
# What lands in etcd is a table of sha256 digests. base64 is encoding rather
# than encryption, so a Secret is not a vault -- which is exactly why the
# tokens themselves are never in one. A reader of etcd learns which principals
# exist and what they may do, and cannot authenticate as any of them.
#
# Rotation is add-then-remove: mint the new credential, add its line, move the
# holder across, delete the old line, restart. Two credentials for one
# principal share a rate-limit bucket, so rotating never doubles a quota.
# The file is read at start-up, so a rolling restart is what applies a change.
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-auth
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
type: Opaque
stringData:
  # <key id>  <principal>  <scopes>  <sha256 of the secret>
  keys: |
    REPLACE_ME_WITH_LINES_FROM_agent-platform_auth_new-key
